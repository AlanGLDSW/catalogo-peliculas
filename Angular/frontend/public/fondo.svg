<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0a2e"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#3a0610"/>
    </linearGradient>
    <!-- Perforaciones de una cinta de película -->
    <pattern id="agujeros" width="60" height="40" patternUnits="userSpaceOnUse">
      <rect x="14" y="10" width="32" height="20" rx="5" fill="#0b1220"/>
    </pattern>
    <radialGradient id="luz" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#cielo)"/>
  <circle cx="1500" cy="260" r="420" fill="url(#luz)"/>
  <circle cx="300" cy="880" r="360" fill="url(#luz)"/>

  <!-- Cintas de película en diagonal -->
  <g transform="rotate(-18 960 540)" opacity="0.55">
    <rect x="-300" y="150" width="2600" height="140" fill="#161b2b"/>
    <rect x="-300" y="150" width="2600" height="40" fill="url(#agujeros)"/>
    <rect x="-300" y="250" width="2600" height="40" fill="url(#agujeros)"/>
    <g fill="#26304a">
      <rect x="120" y="198" width="190" height="44"/>
      <rect x="400" y="198" width="190" height="44"/>
      <rect x="680" y="198" width="190" height="44"/>
      <rect x="960" y="198" width="190" height="44"/>
      <rect x="1240" y="198" width="190" height="44"/>
      <rect x="1520" y="198" width="190" height="44"/>
      <rect x="1800" y="198" width="190" height="44"/>
    </g>

    <rect x="-300" y="760" width="2600" height="140" fill="#161b2b"/>
    <rect x="-300" y="760" width="2600" height="40" fill="url(#agujeros)"/>
    <rect x="-300" y="860" width="2600" height="40" fill="url(#agujeros)"/>
    <g fill="#4a1520">
      <rect x="40" y="808" width="190" height="44"/>
      <rect x="320" y="808" width="190" height="44"/>
      <rect x="600" y="808" width="190" height="44"/>
      <rect x="880" y="808" width="190" height="44"/>
      <rect x="1160" y="808" width="190" height="44"/>
      <rect x="1440" y="808" width="190" height="44"/>
      <rect x="1720" y="808" width="190" height="44"/>
    </g>
  </g>

  <!-- Estrellas -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="180" cy="120" r="2"/><circle cx="520" cy="80" r="1.5"/>
    <circle cx="840" cy="150" r="2"/><circle cx="1180" cy="60" r="1.5"/>
    <circle cx="1620" cy="130" r="2"/><circle cx="1820" cy="320" r="1.5"/>
    <circle cx="90" cy="520" r="1.5"/><circle cx="1760" cy="700" r="2"/>
    <circle cx="700" cy="960" r="1.5"/><circle cx="1300" cy="1000" r="2"/>
  </g>
</svg>
